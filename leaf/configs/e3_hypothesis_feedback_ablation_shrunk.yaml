# E3 re-verified under the same shrunk-budget/extended-vocabulary
# condition E2's reportable result uses (leaf/configs/e2_agentic_value_add.yaml),
# not just the original B=400 condition -- addresses the paper's own
# Limitations note that E3/E4 had only been tested at one configuration.
experiment: e3_hypothesis_feedback_ablation_shrunk
methods: [leaf_full, leaf_ablation_d]
split: chemotype_cold
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
budget: 80
pool_size: 40
q: 8
acquisition_function: multi_objective_ucb
hypothesis_every_k: 5
max_counterfactual_pairs: 20
