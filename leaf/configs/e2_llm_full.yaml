# E2 -- full LLM proposer run (paper-quality seed count). Research plan §7.
#
# Same reduced budget/pool_size as e2_llm_pilot.yaml (LLM latency-bound,
# not vocabulary-bound): ~4s/candidate x 80 candidates/seed x 24
# (seed,split) combinations ~= 2 hours total. Run this in the background.
experiment: e2_llm_full
methods: [leaf_llm, static_ga, random_search]
splits: [random, scaffold_cold, chemotype_cold]
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: true
hypothesis_every_k: 4
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
