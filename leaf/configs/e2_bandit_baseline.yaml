# E2 -- Thompson-sampling bandit baseline (leaf/baselines/bandit_proposer.py),
# a lighter real alternative to a full trained generative Proposer (§7
# item 3, still deferred as real training work). Same protocol as the
# main real-LLM comparison (leaf/configs/e2_llm_full.yaml) for direct
# comparability -- fast and free (no LLM calls), so run at full n=8,
# all three splits.
experiment: e2_bandit_baseline
methods: [bandit, static_ga, random_search]
splits: [random, scaffold_cold, chemotype_cold]
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: true
hypothesis_every_k: 4
log_diagnostics: true
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
