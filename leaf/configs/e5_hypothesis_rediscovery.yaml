# E5 -- Hypothesis rediscovery, secondary/leakage-probed (RQ4). Research plan §5.5, §7.
experiment: e5_hypothesis_rediscovery
# Rescoped to structure-PROPERTY (potency), not structure-tropism -- the
# actual LUMI-lab finding is a potency association from brominated tails,
# not an organ-tropism rule (§5.5).
target_property: potency
target_fragment_slot: halogenation
