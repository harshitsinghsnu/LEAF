# Genuine reasoning-mode Proposer + real objective-scored prompt: tests
# whether actual extended reasoning makes better use of injected scores
# than the non-reasoning models did (v3_scored, §3.3). Exploratory scale
# (n=4, random split), matching v3_scored's protocol exactly.
experiment: e2_qwen3_reasoning_scored_check
methods: [leaf_llm_qwen3_reasoning_scored, static_ga, random_search]
splits: [random]
seeds: [0, 1, 2, 3]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: false
log_diagnostics: true
dedupe_pool: false
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
