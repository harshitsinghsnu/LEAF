# CoT structural-rationale check (external review item #4): requires a
# short mechanistic rationale before each candidate, no scores shown.
# Exploratory scale (n=4, random split), matching v3_scored/v4_rank's
# protocol exactly for direct comparison.
experiment: e2_llm_v5cot_check
methods: [leaf_llm_v5cot, static_ga, random_search]
splits: [random]
seeds: [0, 1, 2, 3]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: false
log_diagnostics: true
dedupe_pool: false
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
