# E2 diagnostics run: mechanistic comparison (edit distance, novelty,
# operator mix) + acquisition-disabled ablation + second same-scale local
# model (Qwen2.5 7B). Reduced scope (4 seeds, 1 split) given Qwen2.5's
# higher per-candidate latency (~10.3s vs ~4s for Llama 3.1 8B) --
# reported as a diagnostic/exploratory comparison, not a fully-powered
# statistical claim (same disclosure standard as the original n=4 pilot).
experiment: e2_diagnostics
methods: [leaf_llm, leaf_llm_no_acquisition, leaf_llm_qwen, static_ga, random_search]
splits: [random]
seeds: [0, 1, 2, 3]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: true
hypothesis_every_k: 4
log_diagnostics: true
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
