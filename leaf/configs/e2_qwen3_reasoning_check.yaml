# Genuine reasoning-mode Proposer check (external review: test an actual
# reasoning-tuned model, not just a prompted rationale). Qwen3-8B with
# Ollama's native "think" API enabled (format:"json" dropped for this
# condition -- verified directly that forcing JSON mode suppresses the
# reasoning phase entirely). Default prompt (v1), no scores shown.
# Exploratory scale (n=4, random split), matching the other enriched/
# control checks' protocol.
experiment: e2_qwen3_reasoning_check
methods: [leaf_llm_qwen3_reasoning, static_ga, random_search]
splits: [random]
seeds: [0, 1, 2, 3]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: false
log_diagnostics: true
dedupe_pool: false
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
