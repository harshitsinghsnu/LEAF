# Richer-prompt control (external review item #2): identical protocol to
# the primary sweep, but the LLM Proposer is given real per-archive-member
# objective scores and an explicit objective description (v3_scored),
# instead of only fragment identities. Exploratory scale (n=4, random
# split) given real per-seed compute cost already established.
experiment: e2_llm_v3scored_check
methods: [leaf_llm_v3scored, static_ga, random_search]
splits: [random]
seeds: [0, 1, 2, 3]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: false
log_diagnostics: true
dedupe_pool: false
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
