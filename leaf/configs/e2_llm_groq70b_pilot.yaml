# E2 -- Llama 3.3 70B via Groq, reduced-scope pilot (4 seeds, one split).
# Groq's free tier caps this model at 1000 requests/day; a full 8-seed x
# 3-split sweep needs ~1,920 LLM calls (only the leaf_llm_groq70b method
# hits the API -- static_ga/random_search are local/free), which exceeds
# that cap. This pilot (4 seeds x 1 split x 80 calls = 320 calls) fits
# comfortably and is reported as exploratory, at the same disclosure
# standard as the original n=4 pilots elsewhere in this paper.
experiment: e2_llm_groq70b_pilot
methods: [leaf_llm_groq70b, static_ga, random_search]
splits: [random]
seeds: [0, 1, 2, 3]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: true
hypothesis_every_k: 4
log_diagnostics: true
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
