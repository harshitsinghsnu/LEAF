# Perturbation control (external-paper-inspired, arXiv:2610.00898): real
# score VALUES, randomly reassigned to the wrong fragment identity,
# testing whether v3_scored's effect depends on the true score-to-fragment
# correspondence or merely on numbers being present. Matches v3_scored's
# protocol exactly (n=4, random split) for a direct comparison.
experiment: e2_llm_v6shuffled_check
methods: [leaf_llm_v6shuffled, static_ga, random_search]
splits: [random]
seeds: [0, 1, 2, 3]
budget: 40
pool_size: 10
q: 5
acquisition_function: multi_objective_ucb
ucb_beta: 2.0
use_verifier: true
use_hypothesis: false
log_diagnostics: true
dedupe_pool: false
reference_point: [-5.0, -5.0]
primary_statistic: bootstrap_ci_median
